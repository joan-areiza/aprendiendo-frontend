<!DOCTYPE html> <!-- Le dice al sistema que este es un archivo HTML -->
<html lang"es"> <!-- Establece el lenguaje de la WEB en español --> <!-- Nota: a esta línea le falta el signo "=" entre lang y "es"; aun así los navegadores suelen tolerar el error y siguen interpretando la página -->
 
<head> <!-- No se mostrara en la pagina web lo que este dentro de esta etiqueta -->
    <meta charset="UTF-8" /> <!-- Permite el manejo del idioma español --> <!-- La barra "/" al final es opcional en HTML5 y solo indica que la etiqueta se cierra a sí misma -->
    <meta name="viewport" content="width=device=width" , initial-scale="1.0"> <!-- Permite que la pagina web sea responsive --> <!-- Nota: lo normal es escribir "width=device-width, initial-scale=1.0" dentro de un mismo atributo content; aquí initial-scale quedó fuera de las comillas, separado por una coma, lo cual no sigue la sintaxis habitual -->
    <title> HTML, CSS Y JS - ADSO - Conceptos WEB Bàsicos </title> <!-- Titulo en navegador -->
    <link rel="stylesheet" href="/maquetacion/css/estilos.css" /> <!-- Vincula la hoja de estilos con la pagina web --> <!-- href indica la ruta del archivo CSS que se va a cargar -->
</head> <!-- Cierra la sección de metadatos -->
 
<body> <!-- Abre la sección visible de la página, aquí va todo el contenido que ve el usuario -->
 
    <h1> Lenguajes de programaciòn </h1><!-- Titulo -->
    <h2> Introducciòn </h2> <!-- Subtitulo -->
 
    <ul> <!-- Crea una lista desordenada -->
        <li> <!-- li crea un elemento (ítem) dentro de la lista -->
            <a href="/maquetacion/index.html">Inicio</a> <!-- Adiciona un enalce en el item para redirigirse a otra sitio -->
        </li> <!-- Crea un item en la lista -->
        <li>
            <a href="/maquetacion/html/contacto.html">Contacto</a> 
        </li>
        <li>
            <a href="/maquetacion/html/conceptos-css.html">CSS</a> 
        </li>
    </ul> <!-- Cierra la lista desordenada -->
 
    <p> En esta pagina web conoceras algunos lenguajes de programaciòn </p> <!-- Parrafo -->
    <hr> <!-- hr agrega una línea horizontal que separa visualmente el contenido -->
    <h1> Listas </h1> 
    <ul> <!-- Crea una lista desordenada -->
        <li> HTML </li> <!-- Crea un item en la lista -->
        <li> CSS </li> 
        <li> JS </li> 
        <li> PHP </li> 
    </ul>
    <ol> <!-- Crea una lista ordenada (con numeros) -->
        <li> Java </li> 
        <li> React </li> 
        <li> C++ </li> 
        <li> C# </li> 
    </ol> <!-- Cierra la lista ordenada -->
    <hr> <!-- Agrega un separador -->
    <h1>Imagenes</h1> 
    <img alt="Este es el logo de React" src="/maquetacion/img/React-Logo.png" /> <!-- Agrega una imagen; el "alt" describe la imagen si no carga -->
    <img alt="Este es el logo de HTML, CSS Y JS" src="/maquetacion/img/Logo-HTML_CSS_JS.png" /> 
</body> <!-- Se mostrara en la pagina lo que este dentro de esta etiqueta -->
 
</html> <!-- Permite hacerle entender al sistema que se usara el lenguaje HMTL -->
