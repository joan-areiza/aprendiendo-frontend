<!DOCTYPE html> <!-- Indica al navegador que el documento es HTML5 -->
<html lang="es"> <!-- Abre el documento HTML; lang="es" indica que el idioma es español -->
<head> <!-- Abre la sección de metadatos de la página -->
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres UTF-8 para mostrar bien tildes y ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página para verse bien en dispositivos móviles -->
    <script src="/javascript/js/main.js" defer></script> <!-- La etiqueta script importa un archivo de JavaScript externo indicado en src; el atributo defer hace que el script se ejecute después de que toda la página haya cargado, sin bloquear la carga -->
    <title>JavaScript</title> <!-- Texto que se muestra en la pestaña del navegador -->
</head> <!-- Cierra la sección de metadatos -->
<body> <!-- Abre la sección visible de la página -->
    <h1>JavaScript ADSO</h1> <!-- Encabezado principal de la página -->
    <div id = "nomrbres"></div> <!-- div vacío que servirá de contenedor; el atributo id le da un identificador único que después se usa desde JavaScript para encontrar y modificar este elemento -->
    <div id = "datos"></div> <!-- Otro div vacío que funcionará como contenedor, con su propio identificador único "datos" -->
</body> <!-- Cierra la sección visible -->
</html> <!-- Cierra el documento HTML -->
