<!DOCTYPE html> <!-- Le dice al sistema que este es un archivo HTML -->
<html lang="es"> <!-- Establece el lenguaje de la WEB en español -->

<head> <!-- No se mostrara en la pagina web lo que este dentro de esta etiqueta -->
    <meta charset="UTF-8"> <!-- Permite el manejo del idioma español --> <!-- El atributo charset define la codificación de caracteres del documento, aquí se usa UTF-8 para soportar tildes y la ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura cómo se ve la página en celulares y tablets --> <!-- El atributo content trae dos valores: width=device-width iguala el ancho de la página al ancho de la pantalla, e initial-scale=1.0 fija el nivel de zoom inicial -->
    <link rel="stylesheet" type="text/css" href="/flexbox/css/style.css" /> <!-- Vincula la hoja de estilos con la pagina web --> <!-- rel="stylesheet" indica que el archivo enlazado es una hoja de estilos, type="text/css" indica el tipo de archivo y href da la ruta del archivo -->
</head>
    <title>Flexbox</title> <!-- Titulo en navegador -->
</head> <!-- Esta es una segunda etiqueta de cierre de head repetida por error en el archivo original; head ya se había cerrado antes -->

<body> <!-- Se mostrara en la pagina lo que este dentro de esta etiqueta -->
    <h1>Aprendiendo FLEXBOX ADSO</h1> <!-- Titulo -->
    <section class="flex-container"> <!-- Crea una seccion --> <!-- El atributo class="flex-container" permite aplicarle desde el CSS los estilos que convierten esta sección en un contenedor flexible -->
        <div class="caja c1">  <!-- Crea una division --> <!-- El div tiene dos clases separadas por espacio: "caja" da el estilo general de todas las cajas y "c1" da el estilo específico de esta caja en particular -->
            Caja1 <!-- Texto que se muestra dentro de la caja -->
        </div> <!-- Cierra la división de la caja 1 -->
        <div class="caja c2">
            Caja2
        </div>
        <div class="caja c3">
            Caja3
        </div>
        <div class="caja c4">
            Caja4
        </div>
    </section> <!-- Cierra la sección que contiene todas las cajas -->
</body> <!-- Cierra la sección visible de la página -->

</html> <!-- Permite hacerle entender al sistema que se usara el lenguaje HMTL -->
