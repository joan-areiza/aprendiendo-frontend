<!DOCTYPE html> <!-- Indica al navegador que el documento es HTML5 -->
<html lang="es"> <!-- Abre el documento HTML; lang="es" señala que el idioma es español -->
<head> <!-- Abre la sección de metadatos de la página -->
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres UTF-8 para mostrar bien tildes y ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta la página para que se vea bien en dispositivos móviles -->
    <link rel="stylesheet" href="/css-avanzado/03-box-sizing/css/style.css"> <!-- Conecta el archivo CSS externo -->
    <title>Box Sizing</title> <!-- Texto que se muestra en la pestaña del navegador -->
</head> <!-- Cierra la sección de metadatos -->
<body> <!-- Abre la sección visible de la página -->
    <h1>Box Sizing</h1> <!-- Encabezado principal de la página -->
    <div class="caja"> <!-- div es un contenedor genérico; class="caja" permite aplicarle estilos desde el CSS -->
        <h2>Soy la caja 1</h2> <!-- Encabezado de nivel 2, un título más pequeño que h1 -->
        <p>Soy el contenido de la caja 1.</p> <!-- Párrafo con el texto de contenido de la caja -->
    </div> <!-- Cierra el contenedor "caja" -->
</body> <!-- Cierra la sección visible -->
</html> <!-- Cierra el documento HTML -->
