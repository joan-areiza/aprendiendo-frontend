<!DOCTYPE html> <!-- Indica al navegador que este documento es HTML5, siempre va en la primera línea del archivo -->
<html lang="es"> <!-- Abre el documento HTML; lang="es" indica que el contenido está en español -->
<head> <!-- Abre la sección de metadatos, información que no se muestra directamente en la página -->
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres UTF-8, necesaria para mostrar bien tildes y la ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Controla el comportamiento en pantallas móviles: ajusta el ancho al del dispositivo y fija el zoom inicial en 1.0 -->
    <link rel="stylesheet" href="/css-avanzado/02-variables/css/style.css"> <!-- Conecta el archivo de estilos externo indicando su ruta -->
    <title>Variables en CSS</title> <!-- Texto que aparece en la pestaña del navegador -->
</head> <!-- Cierra la sección de metadatos -->
<body> <!-- Abre la sección visible de la página -->
    <h1>Variables en CSS</h1> <!-- Encabezado principal de la página -->
    <p>Hola Mundo</p> <!-- Párrafo de texto simple -->
    <a href="#">senaado.com</a> <!-- Enlace que por ahora apunta a la misma página (href="#") -->
</body> <!-- Cierra la sección visible -->
</html> <!-- Cierra el documento HTML -->
